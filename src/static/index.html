<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi Cartera</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --good:           #006300;
    --critical:       #d03b3b;

    --slot-1: #2a78d6; /* blue */
    --slot-2: #eb6834; /* orange */
    --slot-3: #1baf7a; /* aqua */
    --slot-4: #eda100; /* yellow */
    --slot-5: #e87ba4; /* magenta */
    --slot-6: #008300; /* green */
    --slot-7: #4a3aa7; /* violet */
    --slot-8: #e34948; /* red */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --good:           #0ca30c;
      --critical:       #e66767;

      --slot-1: #3987e5;
      --slot-2: #d95926;
      --slot-3: #199e70;
      --slot-4: #c98500;
      --slot-5: #d55181;
      --slot-6: #008300;
      --slot-7: #9085e9;
      --slot-8: #e66767;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; gap: 12px; flex-wrap: wrap;
  }
  header.top h1 { font-size: 20px; margin: 0; }
  .updated { color: var(--text-muted); font-size: 13px; }

  button#refresh {
    background: var(--slot-1); color: #fff; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  button#refresh:disabled { opacity: 0.6; cursor: default; }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px;
  }

  .stat-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  .stat-tile { }
  .stat-tile .label { color: var(--text-secondary); font-size: 13px; margin-bottom: 6px; }
  .stat-tile .value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-tile .sub { font-size: 13px; margin-top: 4px; font-variant-numeric: tabular-nums; }

  .panels {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;
  }
  @media (max-width: 720px) { .panels { grid-template-columns: 1fr; } }
  .panels h2 { font-size: 14px; margin: 0 0 14px; color: var(--text-secondary); font-weight: 600; }

  .bar-row { margin-bottom: 10px; }
  .bar-row .bar-label {
    display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px;
  }
  .bar-row .bar-label .name { color: var(--text-primary); }
  .bar-row .bar-label .val { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .bar-track {
    height: 10px; border-radius: 5px; background: var(--gridline); overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 5px; }

  h2.section-title { font-size: 16px; margin: 28px 0 12px; }

  .evo-chart { margin: 8px 0 14px; }
  .chart-legend {
    display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-top: 6px;
  }
  .chart-legend i {
    display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 5px; vertical-align: middle;
  }

  .range-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .range-btn {
    background: none; border: 1px solid var(--border); color: var(--text-secondary);
    font-size: 11px; padding: 3px 10px; border-radius: 12px; cursor: pointer;
    font-family: inherit;
  }
  .range-btn:hover { border-color: var(--slot-1); color: var(--text-primary); }
  .range-btn.active { background: var(--slot-1); border-color: var(--slot-1); color: #fff; }

  .fondos-grid {
    display: grid; grid-template-columns: 1fr;
    gap: 14px;
  }
  .fondo-card h3 { font-size: 15px; margin: 0 0 2px; }
  .fondo-card h3 a { color: inherit; text-decoration: none; }
  .fondo-card h3 a:hover { text-decoration: underline; }
  .fondo-card .gestora { color: var(--text-muted); font-size: 12px; margin-bottom: 12px; }
  .fondo-metrics {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-bottom: 12px;
  }
  .fondo-metrics .m-label { color: var(--text-secondary); font-size: 12px; }
  .fondo-metrics .m-value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pos { color: var(--good); }
  .neg { color: var(--critical); }

  details.ops summary {
    cursor: pointer; font-size: 13px; color: var(--slot-1); font-weight: 600;
    list-style: none; margin-bottom: 8px;
  }
  details.ops summary::-webkit-details-marker { display: none; }
  .ops-table-wrap { overflow-x: auto; max-width: 100%; }
  table.ops-table {
    width: 100%; border-collapse: collapse; font-size: 12px;
  }
  table.ops-table th, table.ops-table td {
    text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  table.ops-table th:first-child, table.ops-table td:first-child,
  table.ops-table th:nth-child(2), table.ops-table td:nth-child(2) { text-align: left; }
  table.ops-table th { color: var(--text-muted); font-weight: 600; }

  #state { padding: 60px 0; text-align: center; color: var(--text-secondary); }
  #state .spinner {
    width: 28px; height: 28px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--gridline); border-top-color: var(--slot-1);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error { color: var(--critical); }

  .chart-tooltip {
    position: fixed; display: none; pointer-events: none;
    background: var(--text-primary); color: var(--surface-1);
    font-size: 12px; padding: 6px 9px; border-radius: 6px; z-index: 50;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }

  .login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-card { width: 100%; max-width: 380px; }
  .login-hint { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 18px; }
  #login-form { display: flex; flex-direction: column; gap: 12px; }
  #login-form label { font-size: 13px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 5px; }
  #login-form input {
    font-family: inherit; font-size: 14px; padding: 9px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--page-plane); color: var(--text-primary);
  }
  #login-form input:focus { outline: 2px solid var(--slot-1); outline-offset: 1px; }
  #login-submit {
    background: var(--slot-1); color: #fff; border: none; border-radius: 8px;
    padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px;
  }
  #login-submit:disabled { opacity: 0.6; cursor: default; }
  .login-error { color: var(--critical); font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<div id="chart-tooltip" class="chart-tooltip"></div>

<div id="login-screen" class="login-screen">
  <div class="card login-card">
    <h2 style="margin-top:0; text-align:center;">Iniciar sesión</h2>
    <form id="login-form">
      <label>Usuario
        <input type="text" id="login-usuario" autocomplete="username" required>
      </label>
      <label>Contraseña
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>
      <button type="submit" id="login-submit">Entrar</button>
    </form>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<div class="wrap" id="app-screen" style="display:none;">
  <header class="top">
    <h1>Mi Cartera</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <span class="updated" id="updated"></span>
      <button id="refresh">Actualizar</button>
      <button id="logout" class="range-btn">Cerrar sesión</button>
    </div>
  </header>

  <div id="state">
    <div class="spinner"></div>
    <div id="state-text">Conectando… puede tardar 15-20s</div>
  </div>

  <div id="content" style="display:none;">
    <div class="stat-grid" id="stat-grid"></div>

    <div class="card" style="margin-bottom:20px;">
      <h2>Evolución de la cartera</h2>
      <div id="chart-evolucion"></div>
    </div>

    <h2 class="section-title">Planes de ahorro periódico</h2>
    <div class="fondos-grid" id="planes-grid"></div>

    <h2 class="section-title">Fondos</h2>
    <div class="fondos-grid" id="fondos-grid"></div>

    <h2 class="section-title">Distribución</h2>
    <div class="panels">
      <div class="card">
        <h2>Distribución por tipo de activo</h2>
        <div id="chart-tipo"></div>
      </div>
      <div class="card">
        <h2>Distribución geográfica</h2>
        <div id="chart-geo"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SLOTS = ['--slot-1','--slot-2','--slot-3','--slot-4','--slot-5','--slot-6','--slot-7','--slot-8'];

const GEO_ORDER = ['USA / Canadá','Euro Zona','Asia','UK','Japón','Europa no Euro','Latino-américa','Otros'];
const TIPO_ORDER = ['Renta Variable','Renta Fija'];

function slotFor(nombre, order) {
  const idx = order.indexOf(nombre);
  return `var(${SLOTS[idx >= 0 ? idx % 8 : 7]})`;
}

function parseEfectivo(str) {
  if (!str) return null;
  const cleaned = str.replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? null : n;
}
function parseFechaEs(str) {
  const [d, m, y] = str.split('/').map(Number);
  return new Date(y, m - 1, d);
}
function formatFechaISO(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fechaCorta(fecha) {
  return fecha.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
}
function eurCompact(n) {
  return new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n);
}

function showTip(evt, html) {
  const tip = document.getElementById('chart-tooltip');
  tip.innerHTML = html;
  tip.style.left = (evt.clientX + 14) + 'px';
  tip.style.top = (evt.clientY + 14) + 'px';
  tip.style.display = 'block';
}
function hideTip() {
  document.getElementById('chart-tooltip').style.display = 'none';
}

function computeRange(values) {
  const rawMin = Math.min(...values);
  const rawMax = Math.max(...values);
  const pad = (rawMax - rawMin) * 0.15 || Math.max(Math.abs(rawMax) * 0.05, 1);
  return [rawMin - pad, rawMax + pad];
}

function yAxis(minV, maxV, padL, padR, padT, width, height, ticks) {
  const n = ticks || 4;
  let lines = '';
  for (let i = 0; i < n; i++) {
    const v = minV + (maxV - minV) * i / (n - 1);
    const y = height - padT - (v - minV) / ((maxV - minV) || 1) * (height - padT * 2);
    lines += `
      <line x1="${padL}" y1="${y.toFixed(1)}" x2="${width - padR}" y2="${y.toFixed(1)}" stroke="var(--gridline)" stroke-width="1"/>
      <text x="${(padL - 8).toFixed(1)}" y="${(y + 3.5).toFixed(1)}" font-size="9" text-anchor="end" fill="var(--text-muted)">${eurCompact(v)}</text>`;
  }
  return lines;
}

const RANGE_OPTIONS = [
  { key: '3M', label: '3M', months: 3 },
  { key: '6M', label: '6M', months: 6 },
  { key: 'YTD', label: 'YTD' },
  { key: '1A', label: '1A', years: 1 },
  { key: '3A', label: '3A', years: 3 },
  { key: '5A', label: '5A', years: 5 },
  { key: '10A', label: '10A', years: 10 },
  { key: 'ALL', label: 'Todo' },
];
const CHART_STATE = {};

function rangeCutoff(rangeKey) {
  const now = new Date();
  if (rangeKey === 'ALL') return null;
  if (rangeKey === 'YTD') return new Date(now.getFullYear(), 0, 1);
  const opt = RANGE_OPTIONS.find(o => o.key === rangeKey);
  const d = new Date(now);
  if (opt.months) d.setMonth(d.getMonth() - opt.months);
  if (opt.years) d.setFullYear(d.getFullYear() - opt.years);
  return d;
}

function filterPointsByRange(points, rangeKey) {
  const cutoff = rangeCutoff(rangeKey);
  if (!cutoff) return points;
  const filtered = points.filter(p => p.fecha >= cutoff);
  // si el rango elegido deja <2 puntos (sin historico suficiente aun),
  // mostramos los 2 ultimos disponibles en vez de un grafico vacio
  return filtered.length >= 2 ? filtered : points.slice(-2);
}

function renderRangeButtons(chartId, activeKey) {
  return `<div class="range-filter" data-chart="${chartId}">${RANGE_OPTIONS.map(o =>
    `<button class="range-btn${o.key === activeKey ? ' active' : ''}" onclick="applyRangeFilter('${chartId}','${o.key}')">${o.label}</button>`
  ).join('')}</div>`;
}

function applyRangeFilter(chartId, rangeKey) {
  const state = CHART_STATE[chartId];
  if (!state) return;
  state.activeRange = rangeKey;
  const filtered = filterPointsByRange(state.points, rangeKey);
  state.views.forEach(v => drawSeriesChart(v.targetId, filtered, v.series, v.opts));

  const bar = document.querySelector(`.range-filter[data-chart="${chartId}"]`);
  if (bar) {
    [...bar.children].forEach((btn, i) => btn.classList.toggle('active', RANGE_OPTIONS[i].key === rangeKey));
  }
}

function drawSeriesChart(chartId, points, seriesDefs, opts) {
  const container = document.getElementById(chartId + '-svg');
  if (!container) return;
  opts = opts || {};
  const width = opts.width || 560, height = opts.height || 160;
  const padL = opts.padL || 64, padR = opts.padR || 16, padT = opts.padT || 14, padB = opts.padB || 22;

  if (points.length < 2) {
    container.innerHTML = '<div style="color:var(--text-muted); font-size:13px; padding:16px 0;">No hay datos suficientes en este rango.</div>';
    return;
  }

  const allValues = points.flatMap(p => seriesDefs.map(s => p[s.key]));
  const [minV, maxV] = computeRange(allValues);
  const spanV = (maxV - minV) || 1;
  const stepX = (width - padL - padR) / (points.length - 1);

  function toXY(i, v) {
    return [padL + i * stepX, height - padB - ((v - minV) / spanV) * (height - padT - padB)];
  }

  const paths = seriesDefs.map(s => {
    const d = points.map((p, i) => {
      const [x, y] = toXY(i, p[s.key]);
      return `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
    }).join(' ');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }).join('');

  const dots = seriesDefs.map(s => points.map((p, i) => {
    const [x, y] = toXY(i, p[s.key]);
    const tipHtml = `${s.label}<br>${fechaCorta(p.fecha)} · ${eur(p[s.key])}`;
    return `
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${s.color}" stroke="var(--surface-1)" stroke-width="1.5"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" fill="transparent"
        onmousemove="showTip(event, '${tipHtml}')" onmouseleave="hideTip()" style="cursor:pointer;"/>`;
  }).join('')).join('');

  const labelEvery = Math.max(1, Math.ceil(points.length / 6));
  const labels = points.map((p, i) => {
    if (i % labelEvery !== 0 && i !== points.length - 1) return '';
    const [x] = toXY(i, minV);
    return `<text x="${x.toFixed(1)}" y="${height - 6}" font-size="9" text-anchor="middle" fill="var(--text-muted)">${fechaCorta(p.fecha)}</text>`;
  }).join('');

  const legend = seriesDefs.length > 1
    ? `<div class="chart-legend">${seriesDefs.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div>`
    : '';

  container.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="xMidYMid meet">
      ${yAxis(minV, maxV, padL, padR, padT, width, height, 4)}
      ${paths}
      ${dots}
      ${labels}
    </svg>
    ${legend}`;
}

function renderEvolutionChart(operaciones, chartId) {
  const points = (operaciones || [])
    .map(op => ({ fecha: parseFechaEs(op.fecha), valor: parseEfectivo(op.efectivo) }))
    .filter(p => p.valor !== null && !isNaN(p.fecha))
    .sort((a, b) => a.fecha - b.fecha);

  if (points.length < 2) return '';

  CHART_STATE[chartId] = {
    points,
    views: [{
      targetId: chartId,
      series: [{ key: 'valor', color: 'var(--slot-1)', label: 'Valoración' }],
      opts: { width: 560, height: 160, padL: 64, padR: 16, padT: 14, padB: 22 },
    }],
    activeRange: 'ALL',
  };

  return `
    <div class="evo-chart">
      ${renderRangeButtons(chartId, 'ALL')}
      <div id="${chartId}-svg"></div>
    </div>`;
}

function computeCarteraSeries(fondos) {
  const eventosPorFondo = (fondos || []).map(f => (f.operaciones || [])
    .map(op => ({
      fecha: parseFechaEs(op.fecha),
      esAporte: (op.concepto || '').toUpperCase().includes('SUSCRIP'),
      importeBruto: parseEfectivo(op.importeBruto),
      efectivo: parseEfectivo(op.efectivo),
    }))
    .filter(e => e.fecha instanceof Date && !isNaN(e.fecha))
  );

  const fechasSet = new Set();
  eventosPorFondo.forEach(evs => evs.forEach(e => fechasSet.add(e.fecha.getTime())));
  const fechas = [...fechasSet].sort((a, b) => a - b).map(t => new Date(t));

  const ultimoValorPorFondo = eventosPorFondo.map(() => 0);
  const aportadoPorFondo = eventosPorFondo.map(() => 0);

  return fechas.map(fecha => {
    eventosPorFondo.forEach((evs, i) => {
      evs.forEach(e => {
        if (e.fecha.getTime() !== fecha.getTime()) return;
        if (e.esAporte && e.importeBruto) aportadoPorFondo[i] += e.importeBruto;
        if (e.efectivo !== null) ultimoValorPorFondo[i] = e.efectivo;
      });
    });
    const aportado = aportadoPorFondo.reduce((s, v) => s + v, 0);
    const valor = ultimoValorPorFondo.reduce((s, v) => s + v, 0);
    return { fecha, aportado, valor, beneficio: valor - aportado };
  });
}

function renderCarteraEvolutionChart(fondos) {
  const chartId = 'cartera-evo';
  const container = document.getElementById('chart-evolucion');
  const serie = computeCarteraSeries(fondos);

  if (serie.length < 2) {
    container.innerHTML = '<div style="color:var(--text-muted); font-size:13px;">Aún no hay suficiente histórico para dibujar la evolución.</div>';
    return;
  }

  CHART_STATE[chartId] = {
    points: serie,
    views: [
      {
        targetId: chartId,
        series: [
          { key: 'valor', color: 'var(--slot-1)', label: 'Valor de la cartera' },
          { key: 'aportado', color: 'var(--slot-2)', label: 'Aportado acumulado' },
        ],
        opts: { width: 1000, height: 240, padL: 76, padR: 16, padT: 16, padB: 26 },
      },
      {
        targetId: chartId + '-beneficio',
        series: [{ key: 'beneficio', color: 'var(--slot-3)', label: 'Beneficio' }],
        opts: { width: 1000, height: 120, padL: 76, padR: 16, padT: 12, padB: 22 },
      },
    ],
    activeRange: 'ALL',
  };

  container.innerHTML = `
    ${renderRangeButtons(chartId, 'ALL')}
    <div id="${chartId}-svg"></div>
    <h3 style="font-size:13px; color:var(--text-secondary); margin:16px 0 4px;">Beneficio (valor − aportado)</h3>
    <div id="${chartId}-beneficio-svg"></div>`;

  applyRangeFilter(chartId, 'ALL');
}

function eur(n) {
  return new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(n);
}
function pct(n) {
  return new Intl.NumberFormat('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n) + '%';
}

function renderBarList(container, entries, order) {
  const sorted = [...entries].sort((a, b) => b.valor - a.valor);
  const total = sorted.reduce((s, e) => s + Math.max(e.valor, 0), 0);
  container.innerHTML = sorted.map(e => {
    const width = total > 0 ? Math.max(e.valor, 0) / total * 100 : 0;
    return `
      <div class="bar-row">
        <div class="bar-label">
          <span class="name">${e.categoria}</span>
          <span class="val">${pct(e.pct * 100)} · ${eur(e.valor)}</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${width}%; background:${slotFor(e.categoria, order)};"></div>
        </div>
      </div>`;
  }).join('');
}

function renderPlanes(planes) {
  const grid = document.getElementById('planes-grid');
  if (!planes || planes.length === 0) {
    grid.innerHTML = '<div class="card" style="color:var(--text-muted); font-size:13px;">No hay planes de ahorro periódico activos.</div>';
    return;
  }
  grid.innerHTML = planes.map(p => {
    const fondosRows = (p.fondos || []).map(f => `
      <div class="bar-row">
        <div class="bar-label">
          <span class="name">${f.nombre} <span style="color:var(--text-muted);">(${f.gestora})</span></span>
          <span class="val">${f.porcentaje}% · ${eur(f.importe)}</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${f.porcentaje}%; background:var(--slot-1);"></div>
        </div>
      </div>`).join('');

    return `
      <div class="card fondo-card">
        <h3>${p.alias}</h3>
        <div class="gestora">${p.estado} · Próxima ejecución: ${p.proximaEjecucion}</div>
        <div class="fondo-metrics">
          <div><div class="m-label">Importe periódico</div><div class="m-value">${eur(p.importeActual)}</div></div>
          <div><div class="m-label">Periodicidad</div><div class="m-value">${p.periodicidad}</div></div>
          <div><div class="m-label">Cuenta origen</div><div class="m-value">${p.cuentaOrigen}</div></div>
          <div><div class="m-label">Fecha inicio</div><div class="m-value">${formatFechaISO(p.fechaInicio)}</div></div>
        </div>
        <div style="margin-top:8px;">${fondosRows}</div>
      </div>`;
  }).join('');
}

function statTile(label, value, sub, subClass) {
  return `<div class="card stat-tile">
    <div class="label">${label}</div>
    <div class="value">${value}</div>
    ${sub ? `<div class="sub ${subClass || ''}">${sub}</div>` : ''}
  </div>`;
}

function renderDashboard(data) {
  const totalInvertido = data.fondos.reduce((s, f) => s + f.importeAdquisicion, 0);
  const beneficioTotal = data.fondos.reduce((s, f) => s + f.beneficio, 0);
  const rentGlobal = totalInvertido > 0 ? (beneficioTotal / totalInvertido) * 100 : 0;
  const rentClass = rentGlobal >= 0 ? 'pos' : 'neg';
  const rentSigno = rentGlobal >= 0 ? '+' : '';

  document.getElementById('stat-grid').innerHTML = [
    statTile('Patrimonio total', eur(data.patrimonioTotal)),
    statTile('Invertido en fondos', eur(totalInvertido)),
    statTile('Beneficio', `${beneficioTotal >= 0 ? '+' : ''}${eur(beneficioTotal)}`,
      `${rentSigno}${rentGlobal.toFixed(2)}%`, rentClass),
    statTile('Saldo disponible', eur(data.saldoDisponible)),
  ].join('');

  renderCarteraEvolutionChart(data.fondos);

  const tipo = data.distribuciones['DISTRI_CATEGORIA_TIPO_ACTIVO'] || [];
  renderBarList(document.getElementById('chart-tipo'), tipo, TIPO_ORDER);

  const geo = data.distribuciones['DISTRI_CATEGORIA_GEOGRAFICA'] || [];
  renderBarList(document.getElementById('chart-geo'), geo, GEO_ORDER);

  renderPlanes(data.planesAhorro || []);

  document.getElementById('fondos-grid').innerHTML = data.fondos.map(f => {
    const rClass = f.rentabilidadPct >= 0 ? 'pos' : 'neg';
    const rSigno = f.rentabilidadPct >= 0 ? '+' : '';
    const opsRows = (f.operaciones || []).map(op => `
      <tr>
        <td>${op.fecha}</td>
        <td>${op.concepto}</td>
        <td>${op.participaciones}</td>
        <td>${op.valorParticipacion}</td>
        <td>${op.importeBruto}</td>
        <td>${op.comision}</td>
        <td>${op.retencion}</td>
        <td>${op.efectivo}</td>
      </tr>`).join('');

    return `
      <div class="card fondo-card">
        <h3><a href="${f.finectUrl || 'https://www.finect.com/fondos-inversion'}" target="_blank" rel="noopener" title="Ver ${f.isin} en Finect">${f.nombre}</a></h3>
        <div class="gestora">${f.gestora} · ${f.isin}</div>
        <div class="fondo-metrics">
          <div><div class="m-label">Valoración</div><div class="m-value">${eur(f.valoracion)}</div></div>
          <div><div class="m-label">Invertido</div><div class="m-value">${eur(f.importeAdquisicion)}</div></div>
          <div><div class="m-label">Beneficio</div><div class="m-value ${rClass}">${f.beneficio >= 0 ? '+' : ''}${eur(f.beneficio)}</div></div>
          <div><div class="m-label">Rentabilidad</div><div class="m-value ${rClass}">${rSigno}${f.rentabilidadPct.toFixed(2)}%</div></div>
        </div>
        ${renderEvolutionChart(f.operaciones, 'fondo-evo-' + f.isin)}
        <details class="ops">
          <summary>Ver operaciones (${(f.operaciones || []).length})</summary>
          <div class="ops-table-wrap">
            <table class="ops-table">
              <thead><tr>
                <th>Fecha</th><th>Concepto</th><th>Partic.</th><th>V.Partic.</th>
                <th>Bruto</th><th>Comis.</th><th>Reten.</th><th>Efectivo</th>
              </tr></thead>
              <tbody>${opsRows}</tbody>
            </table>
          </div>
        </details>
      </div>`;
  }).join('');

  data.fondos.forEach(f => applyRangeFilter('fondo-evo-' + f.isin, 'ALL'));

  document.getElementById('updated').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-ES');
  document.getElementById('state').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

// Credenciales solo en memoria de esta pestaña: nunca localStorage, nunca disco.
let CREDS = null;

async function load() {
  if (!CREDS) return;
  document.getElementById('state').style.display = 'block';
  document.getElementById('content').style.display = 'none';
  document.querySelector('#state .spinner').style.display = 'block';
  document.getElementById('state-text').textContent = 'Conectando… puede tardar 15-20s';
  document.getElementById('refresh').disabled = true;
  try {
    const res = await fetch('/api/dashboard', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(CREDS),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error desconocido');
    renderDashboard(data);
  } catch (err) {
    document.getElementById('state-text').innerHTML =
      `<span id="error">Error: ${err.message}</span>`;
    document.querySelector('#state .spinner').style.display = 'none';
  } finally {
    document.getElementById('refresh').disabled = false;
  }
}

document.getElementById('refresh').addEventListener('click', load);

document.getElementById('login-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const usuario = document.getElementById('login-usuario').value;
  const password = document.getElementById('login-password').value;
  CREDS = { usuario, password };

  document.getElementById('login-error').textContent = '';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  load();
});

document.getElementById('logout').addEventListener('click', () => {
  CREDS = null;
  document.getElementById('login-password').value = '';
  document.getElementById('content').style.display = 'none';
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
});
</script>
</body>
</html>
